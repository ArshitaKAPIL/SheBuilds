<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHE BUILDS — Review queue</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--ink:#16123F;--muted:#5a5580;--line:#e1e1ee;--bg:#f4f4fb;--gold:#FFC629;--magenta:#DB1272;--ok:#1A8A4A}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 80px}
  h1{font-size:1.5rem;margin:0 0 4px}
  p.sub{color:var(--muted);margin:0 0 24px}
  .gate{max-width:420px;margin:60px auto;padding:24px;border:2px solid var(--line);border-radius:14px;background:#fff}
  .gate label{display:block;font-weight:600;margin-bottom:8px}
  input[type=password]{width:100%;padding:.7em .9em;border:2px solid var(--line);border-radius:8px;font-size:1rem}
  button{cursor:pointer;font:inherit}
  .btn{display:inline-block;padding:.6em 1.2em;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;margin-top:12px}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{padding:.5em 1.1em;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card{background:#fff;border:2px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 4px;font-size:1.05rem}
  .card .meta{color:var(--muted);font-size:.85rem;margin-bottom:8px}
  .card .body{white-space:pre-wrap;margin:0 0 12px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .approve{background:var(--ok);border-color:var(--ok);color:#fff;padding:.5em 1em;border-radius:8px;font-weight:700}
  .reject{background:#fff;border:2px solid var(--magenta);color:var(--magenta);padding:.5em 1em;border-radius:8px;font-weight:700}
  .status{display:inline-block;font-size:.78rem;font-weight:700;padding:.15em .6em;border-radius:99px;margin-bottom:8px}
  .status.pending{background:var(--gold);color:#241A00}
  .status.approved{background:var(--ok);color:#fff}
  .status.rejected{background:#ddd;color:#555}
  .empty{color:var(--muted);padding:24px;text-align:center}
  .err{color:var(--magenta);font-weight:700}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .toolbar button.small{border:2px solid var(--line);background:#fff;border-radius:8px;padding:.4em .8em}
</style>
</head>
<body>
<div class="wrap">
  <div id="gate" class="gate">
    <h1 style="font-size:1.2rem">SHE BUILDS review queue</h1>
    <label for="key">Admin key</label>
    <input id="key" type="password" autocomplete="off">
    <p id="gateErr" class="err" style="margin:8px 0 0;min-height:1.2em"></p>
    <button class="btn" id="unlock" type="button">Unlock</button>
  </div>

  <div id="panel" hidden>
    <div class="toolbar">
      <div><h1>Review queue</h1><p class="sub">Approve items to publish them on the live site. Nothing appears publicly until you approve it.</p></div>
      <button class="small" id="lock" type="button">Lock</button>
    </div>
    <div class="tabs">
      <button class="tab on" data-t="comments" type="button">Comments</button>
      <button class="tab" data-t="pins" type="button">Map builds</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let KEY = sessionStorage.getItem('sb_admin_key') || '';
let TAB = 'comments';
let DATA = { comments: [], pins: [] };

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load(){
  const r = await fetch('/api/admin/data?key=' + encodeURIComponent(KEY), { headers: { 'x-admin-key': KEY } });
  if (r.status === 401) { sessionStorage.removeItem('sb_admin_key'); showGate('That key was not accepted.'); return; }
  DATA = await r.json();
  showPanel();
  render();
}

function showGate(err){
  $('#gate').hidden = false; $('#panel').hidden = true;
  $('#gateErr').textContent = err || '';
}
function showPanel(){ $('#gate').hidden = true; $('#panel').hidden = false; }

function render(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === TAB));
  const items = DATA[TAB] || [];
  const list = $('#list');
  if (!items.length) { list.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
  list.innerHTML = items.map(it => {
    if (TAB === 'comments') {
      return `<div class="card">
        <span class="status ${it.status}">${it.status}</span>
        <h3>${esc(it.name)}${it.field ? ' — ' + esc(it.field) : ''}</h3>
        <div class="meta">${new Date(it.created_at).toLocaleString()}</div>
        <p class="body">${esc(it.body)}</p>
        ${it.status === 'pending' ? `<div class="row"><button class="approve" data-k="comment" data-id="${it.id}" data-a="approve">Approve</button><button class="reject" data-k="comment" data-id="${it.id}" data-a="reject">Reject</button></div>` : ''}
      </div>`;
    }
    return `<div class="card">
      <span class="status ${it.status}">${it.status}</span>
      <h3>${esc(it.title)}</h3>
      <div class="meta">${esc(it.person)} · ${esc([it.place, it.country].filter(Boolean).join(', '))} · ${new Date(it.created_at).toLocaleString()}</div>
      ${it.partner ? `<p class="body"><b>Partner:</b> ${esc(it.partner)}</p>` : ''}
      ${(it.volunteers != null || it.reached != null) ? `<p class="body"><b>Volunteers:</b> ${it.volunteers ?? '—'} &nbsp; <b>People reached:</b> ${it.reached ?? '—'}</p>` : ''}
      ${it.result ? `<p class="body">${esc(it.result)}</p>` : ''}
      <p class="meta">lat ${it.lat}, lon ${it.lon}</p>
      ${it.status === 'pending' ? `<div class="row"><button class="approve" data-k="pin" data-id="${it.id}" data-a="approve">Approve</button><button class="reject" data-k="pin" data-id="${it.id}" data-a="reject">Reject</button></div>` : ''}
    </div>`;
  }).join('');
}

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { TAB = b.dataset.t; render(); }));

$('#list').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  b.disabled = true; b.textContent = '...';
  const r = await fetch('/api/admin/moderate', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-admin-key': KEY },
    body: JSON.stringify({ kind: b.dataset.k, id: b.dataset.id, action: b.dataset.a })
  });
  if (r.ok) load(); else { b.disabled = false; b.textContent = b.dataset.a === 'approve' ? 'Approve' : 'Reject'; alert('That did not go through. Please try again.'); }
});

$('#unlock').addEventListener('click', () => {
  const k = $('#key').value.trim();
  if (!k) return;
  KEY = k; sessionStorage.setItem('sb_admin_key', KEY);
  load();
});
$('#key').addEventListener('keydown', e => { if (e.key === 'Enter') $('#unlock').click(); });
$('#lock').addEventListener('click', () => { sessionStorage.removeItem('sb_admin_key'); KEY = ''; showGate(''); });

if (KEY) load(); else showGate('');
</script>
</body>
</html>
